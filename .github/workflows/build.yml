name: one480 build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python tools/make_icon.py
      - uses: jurplel/install-qt-action@v4
        with: { version: "6.7.3", host: "windows", target: "desktop", arch: "win64_msvc2019_64", cache: true }
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: |
          mkdir dist
          windeployqt --release --no-translations --dir dist build/one480.exe
          copy build/one480.exe dist/
          Compress-Archive -Path dist/* -DestinationPath one480-windows-x64.zip
          Get-FileHash one480-windows-x64.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  one480-windows-x64.zip" } | Out-File -Encoding ascii one480-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: one480-windows-x64
          path: |
            one480-windows-x64.zip
            one480-windows-x64.zip.sha256
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            one480-windows-x64.zip
            one480-windows-x64.zip.sha256
  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
